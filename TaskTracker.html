<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #c67139; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #c67139; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="200" fill="#c67139"></rect><text x="100" y="115" font-size="80" text-anchor="middle" fill="white" font-family="sans-serif">หง</text></svg>
</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
// ===== Mergee Auth Gate (Google Sign-In, จำ 8 ชม.) — เพิ่มโดย Claude =====
// ไฟล์นี้เป็น bundle ที่ถูกแตกแล้วสลับทั้ง <html> (documentElement.replaceWith) จึงใส่เกตใน <body> ตรงๆ ไม่ได้
// (จะถูกลบทิ้งตอนสลับ) — ฟังก์ชันนี้อยู่บน window แล้วถูกเรียกทันทีหลังสลับเสร็จ เพื่อวางเกตทับหน้าจริง
window.__mergeeShowGate = function(){
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxwzXSMXQD1AFjCDTTFm0iZ4eV4Bhi8qzkZI5Te3v4TFz01TxTu7xVET_OaKGv22R2k/exec';
  var CLIENT_ID = '541429667442-6im11d4rrg09m95suab32vcj7kf3lpf1.apps.googleusercontent.com';
  var SESSION_KEY = 'mergee_auth_expiry';
  var SESSION_DURATION_MS = 8 * 60 * 60 * 1000;
  try {
    var exp = parseInt(localStorage.getItem(SESSION_KEY) || '0', 10);
    if (exp > Date.now()) return; // ล็อกอินไว้แล้วและยังไม่หมดอายุ
  } catch (e) {}
  var host = document.body || document.documentElement;
  var gate = document.createElement('div');
  gate.id = 'mergee-auth-gate';
  gate.style.cssText = "position:fixed;inset:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:2147483647;padding:20px;font-family:'Sarabun',sans-serif";
  gate.innerHTML =
    '<div style="background:#fff;border-radius:16px;padding:32px 28px;max-width:340px;width:100%;text-align:center">' +
      '<div style="font-size:22px;font-weight:600;color:#1a1a2e;margin-bottom:6px">Mergee</div>' +
      '<div style="font-size:13px;color:#888;margin-bottom:22px">สำหรับพนักงานที่ได้รับอนุญาตเท่านั้น</div>' +
      '<div id="mergee-g-signin" style="display:flex;justify-content:center"></div>' +
      '<div id="mergee-auth-loading" style="display:none;color:#888;font-size:13px;margin-top:14px">กำลังตรวจสอบสิทธิ์...</div>' +
      '<div id="mergee-auth-error" style="display:none;color:#c62828;font-size:13px;margin-top:14px">อีเมลนี้ไม่มีสิทธิ์เข้าถึงหน้านี้</div>' +
    '</div>';
  host.appendChild(gate);
  var $ = function(id){ return document.getElementById(id); };
  function showError(){
    $('mergee-auth-loading').style.display = 'none';
    $('mergee-auth-error').style.display = 'block';
    $('mergee-g-signin').style.display = 'flex';
  }
  function handleCredentialResponse(response){
    $('mergee-auth-error').style.display = 'none';
    $('mergee-g-signin').style.display = 'none';
    $('mergee-auth-loading').style.display = 'block';
    fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ token: response.credential }) })
      .then(function(r){ return r.json(); })
      .then(function(data){
        $('mergee-auth-loading').style.display = 'none';
        if (data && data.authorized) {
          try { localStorage.setItem(SESSION_KEY, String(Date.now() + SESSION_DURATION_MS)); } catch (e) {}
          gate.remove();
        } else { showError(); }
      })
      .catch(function(){ showError(); });
  }
  function initGate(){
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleCredentialResponse });
      google.accounts.id.renderButton($('mergee-g-signin'), { theme: 'outline', size: 'large', text: 'signin_with' });
    } else { setTimeout(initGate, 150); }
  }
  var g = document.createElement('script');
  g.src = 'https://accounts.google.com/gsi/client'; g.async = true; g.defer = true;
  document.head.appendChild(g);
  initGate();
};
// ===== จบ Mergee Auth Gate =====

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    if (window.__mergeeShowGate) window.__mergeeShowGate(); // วางเกต Google Sign-In ทับหน้าจริงหลังสลับเสร็จ

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

รวมทั้งปี\", en: \"Whole Year\" },\n  allDept: { th: \"ทุกแผนก\", en: \"All Departments\" },\n  kpiTotal: { th: \"KPI รวม\", en: \"Total KPI\" },\n  doneRatio: { th: \"งานเสร็จ\", en: \"Completed\" },\n  onTime: { th: \"ส่งตรงเวลา\", en: \"On-time\" },\n  avgDifficulty: { th: \"ความยากเฉลี่ย\", en: \"Avg. Difficulty\" },\n  noTasks: { th: \"ไม่มีงาน\", en: \"No tasks\" },\n  timeRangeAria: { th: \"ช่วงเวลา\", en: \"Range\" },\n  day: { th: \"วัน\", en: \"Day\" },\n  week: { th: \"สัปดาห์\", en: \"Week\" },\n  month: { th: \"เดือน\", en: \"Month\" },\n  authOnly: { th: \"สำหรับผู้ได้รับอนุญาตเท่านั้น\", en: \"Authorized personnel only\" },\n  password: { th: \"รหัสผ่าน\", en: \"Password\" },\n  enterPassword: { th: \"กรอกรหัสผ่าน\", en: \"Enter password\" },\n  wrongPassword: { th: \"รหัสผ่านไม่ถูกต้อง\", en: \"Incorrect password\" },\n  confirm: { th: \"ยืนยัน\", en: \"Confirm\" },\n  editTask: { th: \"แก้ไขงาน\", en: \"Edit Task\" },\n  newTask: { th: \"เพิ่มงานใหม่\", en: \"New Task\" },\n  taskName: { th: \"ชื่องาน\", en: \"Task Name\" },\n  taskNamePh: { th: \"เช่น ออกแบบแพ็กเกจสินค้าใหม่\", en: \"e.g. Design new packaging\" },\n  department: { th: \"แผนก\", en: \"Department\" },\n  assignee: { th: \"ผู้รับผิดชอบ\", en: \"Assignee\" },\n  addNewEmployee: { th: \"+ เพิ่มพนักงานใหม่\", en: \"+ Add New Employee\" },\n  employeeListPlaceholder: { th: \"รายชื่อพนักงาน\", en: \"Employee List\" },\n  newEmployeeName: { th: \"ชื่อพนักงานใหม่\", en: \"New Employee Name\" },\n  newEmployeeNamePh: { th: \"เช่น น้ำหวาน\", en: \"e.g. Jane\" },\n  newEmployeeDept: { th: \"แผนกของพนักงานใหม่\", en: \"New Employee's Department\" },\n  priority: { th: \"ความเร่งด่วน\", en: \"Priority\" },\n  status: { th: \"สถานะ\", en: \"Status\" },\n  dueDate: { th: \"กำหนดส่ง\", en: \"Due Date\" },\n  difficultyLevel: { th: \"ระดับความยาก (1-5)\", en: \"Difficulty (1-5)\" },\n  details: { th: \"รายละเอียดงาน\", en: \"Details\" },\n  close: { th: \"ปิด\", en: \"Close\" },\n  editStatus: { th: \"แก้ไขสถานะ\", en: \"Edit Status\" },\n  comments: { th: \"คอมเมนต์\", en: \"Comments\" },\n  commentPh: { th: \"เขียนคอมเมนต์…\", en: \"Write a comment…\" },\n  send: { th: \"ส่ง\", en: \"Send\" },\n  delete: { th: \"ลบ\", en: \"Delete\" },\n  noInfo: { th: \"ไม่มีข้อมูล\", en: \"Not provided\" },\n  addTaskThisDay: { th: \"เพิ่มงานวันนี้\", en: \"Add task on this day\" },\n  detailsPh: { th: \"อธิบายสิ่งที่ต้องทำ ขั้นตอน หรือข้อกำหนด\", en: \"What needs to be done, steps or requirements\" },\n  remark: { th: \"หมายเหตุ (Remark)\", en: \"Remark\" },\n  remarkPh: { th: \"บันทึกเพิ่มเติม\", en: \"Additional notes\" },\n  actualCompletedDate: { th: \"วันที่เสร็จจริง\", en: \"Actual Completion Date\" },\n  saveEdit: { th: \"บันทึกการแก้ไข\", en: \"Save Changes\" },\n  add: { th: \"เพิ่มงาน\", en: \"Add\" },\n  cancel: { th: \"ยกเลิก\", en: \"Cancel\" },\n  totalTasks: { th: \"งานทั้งหมด\", en: \"Total Tasks\" },\n  overdue: { th: \"เลยกำหนด\", en: \"Overdue\" },\n  collapse: { th: \"ย่อรายการ\", en: \"Collapse\" },\n  viewMore: { th: \"ดูอีก\", en: \"View\" },\n  items: { th: \"รายการ\", en: \"more\" },\n  addEmployee: { th: \"+ เพิ่มพนักงาน\", en: \"+ Add Employee\" },\n  addEmployeeConfirm: { th: \"เพิ่มพนักงาน\", en: \"Add\" },\n  deleteEmployee: { th: \"ลบพนักงาน\", en: \"Delete Employee\" },\n  deleteEmployeeConfirm: { th: \"ยืนยันการลบพนักงาน\", en: \"Confirm Employee Deletion\" },\n  employeeDeleteCode: { th: \"รหัสยืนยันการลบ\", en: \"Deletion Code\" },\n  enterDeleteCode: { th: \"กรอกรหัสยืนยันการลบ\", en: \"Enter deletion code\" },\n  wrongDeleteCode: { th: \"รหัสไม่ถูกต้อง\", en: \"Incorrect code\" },\n  deleteTaskConfirm: { th: \"ยืนยันการลบงาน\", en: \"Confirm Task Deletion\" },\n  deleteTaskAction: { th: \"ลบงาน\", en: \"Delete Task\" },\n};\n\nconst MONTHS_EN = [\"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\", \"Jul\", \"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\"];\nconst THAI_MONTHS = [\"ม.ค.\", \"ก.พ.\", \"มี.ค.\", \"เม.ย.\", \"พ.ค.\", \"มิ.ย.\", \"ก.ค.\", \"ส.ค.\", \"ก.ย.\", \"ต.ค.\", \"พ.ย.\", \"ธ.ค.\"];\nconst WD_TH = [\"อา\", \"จ\", \"อ\", \"พ\", \"พฤ\", \"ศ\", \"ส\"];\nconst WD_EN = [\"Sun\", \"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\"];\n\nconst dept = (id) => DEPARTMENTS.find((d) => d.id === id) || DEPARTMENTS[0];\nconst prio = (id) => PRIORITIES.find((p) => p.id === id) || PRIORITIES[0];\nconst stat = (id) => STATUSES.find((s) => s.id === id) || STATUSES[0];\nconst L = (obj, lang) => (lang === \"en\" ? obj.en : obj.label);\nconst toLocalISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, \"0\")}-${String(d.getDate()).padStart(2, \"0\")}`;\nconst todayISO = () => toLocalISO(new Date());\n\nfunction daysDiff(a, b) {\n  const A = new Date(a + \"T00:00:00\");\n  const B = new Date(b + \"T00:00:00\");\n  return Math.round((A - B) / 86400000);\n}\n\nfunction formatThaiDate(iso) {\n  const d = new Date(iso + \"T00:00:00\");\n  return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`;\n}\nfunction formatEnDate(iso) {\n  const d = new Date(iso + \"T00:00:00\");\n  return `${d.getDate()} ${MONTHS_EN[d.getMonth()]} ${d.getFullYear()}`;\n}\nfunction formatDate(iso, lang) { return lang === \"en\" ? formatEnDate(iso) : formatThaiDate(iso); }\n\nfunction deadlineInfo(task, lang) {\n  const t = todayISO();\n  if (task.status === \"done\") {\n    const diff = daysDiff(task.dueDate, task.completedDate || t);\n    if (diff > 0) return { text: lang === \"en\" ? `${diff} day(s) early` : `ส่งก่อนกำหนด ${diff} วัน`, tone: \"good\" };\n    if (diff === 0) return { text: lang === \"en\" ? \"On time\" : \"ส่งตรงเวลา\", tone: \"good\" };\n    return { text: lang === \"en\" ? `${Math.abs(diff)} day(s) late` : `ส่งช้า ${Math.abs(diff)} วัน`, tone: \"bad\" };\n  }\n  const diff = daysDiff(task.dueDate, t);\n  if (diff < 0) return { text: lang === \"en\" ? `${Math.abs(diff)} day(s) overdue` : `เลยกำหนด ${Math.abs(diff)} วัน`, tone: \"bad\" };\n  if (diff === 0) return { text: lang === \"en\" ? \"Due today\" : \"ครบกำหนดวันนี้\", tone: \"warn\" };\n  return { text: lang === \"en\" ? `${diff} day(s) left` : `เหลือ ${diff} วัน`, tone: \"ok\" };\n}\n\nfunction seedTasks() {\n  const t = new Date();\n  const iso = (offset) => { const d = new Date(t); d.setDate(d.getDate() + offset); return toLocalISO(d); };\n  return [\n    { id: \"t1\", title: \"จัดเรียงสต็อกหน้าร้านสาขา 1\", department: \"storefront\", assignee: \"e1\", priority: \"normal\", status: \"in_progress\", dueDate: iso(2), completedDate: null, difficulty: 2 },\n    { id: \"t2\", title: \"ออกแบบแพ็กเกจสินค้าคอลเลกชันใหม่\", department: \"design\", assignee: \"e2\", priority: \"urgent\", status: \"review\", dueDate: iso(1), completedDate: null, difficulty: 4 },\n    { id: \"t3\", title: \"ผลิตงาน OEM ล็อต 12/2026\", department: \"production\", assignee: \"e3\", priority: \"very_urgent\", status: \"in_progress\", dueDate: iso(-1), completedDate: null, difficulty: 5 },\n    { id: \"t4\", title: \"สรุปยอดขายประจำสัปดาห์\", department: \"backoffice\", assignee: \"e4\", priority: \"normal\", status: \"done\", dueDate: iso(-2), completedDate: iso(-3), difficulty: 1 },\n    { id: \"t5\", title: \"แกะแบบงานปั้นชิ้นใหม่\", department: \"design\", assignee: \"e2\", priority: \"normal\", status: \"not_started\", dueDate: iso(5), completedDate: null, difficulty: 3 },\n    { id: \"t6\", title: \"ตรวจสอบคุณภาพงานผลิตก่อนส่งมอบ\", department: \"production\", assignee: \"e5\", priority: \"urgent\", status: \"not_started\", dueDate: iso(3), completedDate: null, difficulty: 3 },\n    { id: \"t7\", title: \"จัดทำใบเสนอราคาลูกค้า OEM\", department: \"backoffice\", assignee: \"e4\", priority: \"urgent\", status: \"in_progress\", dueDate: iso(0), completedDate: null, difficulty: 2 },\n    { id: \"t8\", title: \"เก็บงานหน้าร้านหลังปิดเทศกาล\", department: \"storefront\", assignee: \"e1\", priority: \"normal\", status: \"done\", dueDate: iso(-5), completedDate: iso(-6), difficulty: 2 },\n    { id: \"t9\", title: \"ผลิตชิ้นงานศิลปะสั่งทำพิเศษ\", department: \"production\", assignee: \"e3\", priority: \"very_urgent\", status: \"review\", dueDate: iso(-3), completedDate: null, difficulty: 5 },\n    { id: \"t10\", title: \"อัปเดตราคาสินค้าหน้าร้านออนไลน์\", department: \"storefront\", assignee: \"e1\", priority: \"normal\", status: \"done\", dueDate: iso(1), completedDate: iso(-1), difficulty: 1 },\n  ];\n}\n\nfunction computeKPI(employeeId, tasks, monthFilter, yearFilter) {\n  const mine = tasks.filter((t) => {\n    if (t.assignee !== employeeId) return false;\n    if (!t.dueDate) return false;\n    const d = new Date(t.dueDate + \"T00:00:00\");\n    if (yearFilter !== \"all\" && d.getFullYear() !== Number(yearFilter)) return false;\n    if (monthFilter !== \"all\" && d.getMonth() + 1 !== Number(monthFilter)) return false;\n    return true;\n  });\n  const total = mine.length;\n  const completed = mine.filter((t) => t.status === \"done\");\n  const completionScore = total ? (completed.length / total) * 100 : 0;\n  const onTime = completed.filter((t) => daysDiff(t.dueDate, t.completedDate) >= 0);\n  const onTimeScore = completed.length ? (onTime.length / completed.length) * 100 : 0;\n  const difficultyScore = completed.length ? (completed.reduce((s, t) => s + t.difficulty, 0) / completed.length / 5) * 100 : 0;\n  const overall = completionScore * 0.4 + onTimeScore * 0.35 + difficultyScore * 0.25;\n  return { total, doneCount: completed.length, completionScore, onTimeScore, difficultyScore, overall };\n}\n\nfunction segs(value, color) {\n  const filled = Math.round((value / 100) * 12);\n  return Array.from({ length: 12 }, (_, i) => ({ color: i < filled ? color : \"var(--color-neutral-300)\" }));\n}\n\nfunction dedupeEmployees(list) {\n  const seen = new Set();\n  const out = [];\n  for (const e of list) {\n    if (!e || seen.has(e.id)) continue;\n    seen.add(e.id);\n    out.push(e);\n  }\n  return out;\n}\n\nfunction parseComments(raw) {\n  if (!raw) return [];\n  if (Array.isArray(raw)) return raw;\n  try { const v = JSON.parse(String(raw)); return Array.isArray(v) ? v : []; } catch (e) { return String(raw).trim() ? [{ at: \"\", text: String(raw) }] : []; }\n}\n\nfunction blankForm() {\n  return { title: \"\", department: \"storefront\", assignee: \"\", priority: \"normal\", status: \"not_started\", dueDate: todayISO(), completedDate: todayISO(), difficulty: 3, description: \"\", remark: \"\" };\n}\n\nclass Component extends DCLogic {\n  state = {\n    tasks: [], employees: [], loaded: false,\n    tab: \"board\", calMode: \"month\", anchor: todayISO(), deptFilter: \"all\",\n    modalOpen: false, editingId: null, form: blankForm(),\n    addingEmployee: false, newEmployeeName: \"\", newEmployeeDept: \"storefront\",\n    kpiUnlocked: false, kpiPasswordModalOpen: false, kpiPasswordInput: \"\", kpiPasswordError: false,\n    kpiMonthFilter: \"all\", kpiYearFilter: String(new Date().getFullYear()),\n    doneExpanded: false, lang: \"th\",\n    kpiAddingEmployee: false, kpiNewEmployeeName: \"\", kpiNewEmployeeDept: \"storefront\",\n    employeeDeleteModalOpen: false, employeeDeleteTargetId: null, employeeDeletePasswordInput: \"\", employeeDeletePasswordError: false,\n    taskDeleteModalOpen: false, taskDeleteTargetId: null, taskDeletePasswordInput: \"\", taskDeletePasswordError: false,\n  };\n  toggleDoneExpanded = () => this.setState((s) => ({ doneExpanded: !s.doneExpanded }));\n  toggleLang = () => this.setState((s) => ({ lang: s.lang === \"th\" ? \"en\" : \"th\" }));\n\n  componentDidMount() {\n    this.setState({ loaded: true });\n    this.loadFromSheet();\n  }\n\n  normalizeRow(row) {\n    const out = { ...row };\n    [\"dueDate\", \"completedDate\", \"createdDate\"].forEach((k) => {\n      if (out[k] && typeof out[k] === \"string\" && out[k].length > 10) { const dt = new Date(out[k]); out[k] = isNaN(dt) ? out[k].slice(0, 10) : toLocalISO(dt); }\n      if (out[k] === \"\") out[k] = null;\n    });\n    if (out.difficulty !== undefined) out.
